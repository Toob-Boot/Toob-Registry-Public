# ==============================================================================
# PR Gate Check (Stateless, Secretless)
# ==============================================================================
#
# Validates that community PRs only touch allowed content directories.
# This workflow has ZERO access to secrets and performs NO dispatching.
#
# Full PR validation (manifest schema, compatibility matrix dry-run) is
# handled by the Registry API server via GitHub webhook, NOT by GitHub
# Actions. This prevents all known credential theft vectors (V1-V10).
#
# SECURITY MODEL:
# - Trigger: 'pull_request' (NOT 'pull_request_target')
#   Fork PRs run with READ-ONLY permissions in the fork's context.
#   No secrets are available. No tokens can be stolen.
# - Zero secrets stored on this repository
# - Zero third-party actions used (pure shell only)
# - No caching, no artifacts, no network access beyond GitHub API
# - No interpolation of PR metadata in shell (prevents V5)
# - github.token is auto-generated with minimal scope (read-only)
#
# VALIDATION FLOW:
# 1. This workflow: immediate path-check feedback (< 30s)
# 2. GitHub webhook → Registry API server → Firecracker VM → result
#    posted as commit status (< 2min, handled entirely off GitHub)
# ==============================================================================

name: PR Gate Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  path-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Fetch changed files via GitHub API (never clone fork code)
          FILES=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' --paginate 2>/dev/null || echo "")

          if [ -z "$FILES" ]; then
            echo "::warning::Could not fetch changed files."
            exit 0
          fi

          ALLOWED_DIRS="chips/ drivers/ crypto/ arch/ soc/ toolchains/ integrations/"
          FORBIDDEN=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            MATCH=false

            for dir in $ALLOWED_DIRS; do
              case "$file" in
                ${dir}*) MATCH=true; break ;;
              esac
            done

            if [ "$MATCH" = "false" ]; then
              case "$file" in
                registry.json|compatibility_matrix.json)
                  echo "::error file=${file}::Auto-generated file. Must not be edited manually."
                  ;;
                .github/*)
                  echo "::error file=${file}::Workflow files are managed by the core team only."
                  ;;
                *)
                  echo "::error file=${file}::Outside allowed content directories."
                  ;;
              esac
              FORBIDDEN=true
            fi
          done <<< "$FILES"

          if [ "$FORBIDDEN" = "true" ]; then
            echo ""
            echo "::error::Only files in chips/, drivers/, crypto/, arch/, soc/, toolchains/, and integrations/ may be modified."
            echo "::error::See CONTRIBUTING.md for details."
            exit 1
          fi

          echo "All ${FILES_COUNT:-0} changed files are in allowed directories."
